# ╔══════════════════════════════════════════════════════════════════╗
# ║          ng-ray toolkit  —  ready-to-run server config           ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Copy to config.yml and run:  sudo ./ngray server setup
# No manual SNI editing required — all SNIs below are real, tested,
# carrier-whitelisted, REALITY-fit domains.
#
# To score your SNIs against your VPS location: ngray sni test
# To discover even better SNIs near your VPS:   ngray sni discover

server:
  ip: auto
  enable_bbr: true

nginx:
  port: 443

cores:
  # ── xray (loopback 11000-11999, behind nginx:443) ────────────────
  # REALITY+Vision: best MCI bypass — full-duplex XTLS hides TLS-in-TLS.
  # XHTTP: chunked HTTP behind real nginx — survives MTN SNI inspection.
  xray:
    reality:
      - {sni: www.rust-lang.org}    # TLS1.3 + h2 + X25519 + CDN ✓
      - {sni: dl.google.com}        # near EU VPS, OCSP stapling ✓
      - {sni: addons.mozilla.org}   # widely carrier-whitelisted ✓
      - {sni: mozilla.org}          # distinct SNI, same strong properties ✓
      - {sni: crates.io}            # Cloudflare-backed, fast ✓
    xhttp:
      - {sni: www.python.org}       # HTTP shape — distinct from Vision
      - {sni: pypi.org}             # CDN-backed, second XHTTP SNI
      - {sni: jquery.com}           # widely cached/whitelisted CDN ✓
      - {sni: react.dev}            # Vercel-backed, clean TLS ✓

  # ── shoes (loopback 12000-12999, behind nginx:443 + independent QUIC) ──
  # Rust TLS → different ClientHello fingerprint from xray/sing-box.
  # AnyTLS pads records to defeat length-based DPI (proto: anytls).
  # TUIC + Hysteria2 via shoes = Rust QUIC stack, distinct from Go binaries.
  shoes:
    reality:
      - {sni: www.debian.org,       proto: anytls}
      - {sni: www.archlinux.org,    proto: anytls}
      - {sni: www.nginx.org,        proto: anytls}
      - {sni: gradle.org,           proto: anytls}
      - {sni: ubuntu.com,           proto: vless_vision}
      - {sni: canonical.com,        proto: anytls}
    tuic:
      enabled: true
      port: 36712       # Rust TUIC — different stack from singbox TUIC (Go)
      sni: www.rust-lang.org
    hysteria2:
      enabled: true
      port: 36713       # Rust Hysteria2 — different stack from standalone hy2 (Go)
      sni: www.rust-lang.org
      obfs: salamander

  # ── sing-box (loopback 13000-13999, behind nginx:443) ────────────
  # Best client support: husi, exclave, nekobox use sing-box natively.
  singbox:
    reality:
      - {sni: docs.python.org,      proto: anytls}
      - {sni: pkg.go.dev,           proto: anytls}
      - {sni: kotlinlang.org,       proto: vless_vision}
      - {sni: nodejs.org,           proto: anytls}
      - {sni: rubygems.org,         proto: anytls}
      - {sni: jetbrains.com,        proto: vless_vision}

    # TUIC v5: QUIC+BBR, h3 ALPN. Different stack from hysteria2.
    # tuic:// URI supported by nekobox, husi, exclave, v2rayN (recent).
    tuic:
      enabled: true
      port: 36711
      sni: www.rust-lang.org

    # ShadowTLS v3: real TLS handshake to SNI wraps inner Shadowsocks.
    # Indistinguishable from HTTPS to DPI. ss:// + shadow-tls plugin.
    shadowtls:
      enabled: true
      port: 2443
      sni: www.rust-lang.org

  # ── hysteria2 (independent QUIC/UDP, NOT behind nginx) ───────────
  # Salamander turns QUIC into patternless random UDP — survives packet loss.
  # alt_ports: clients rotate freely; firewall REDIRECT maps all → port 443.
  hysteria2:
    enabled: true
    port: 443
    alt_ports: [8443, 2087, 2096]
    sni: www.rust-lang.org
    obfs: salamander

  # ── fptn (full-tunnel TUN VPN — disabled unless explicitly needed) ──
  fptn:
    enabled: false
    port: 2096
    sni: www.rust-lang.org
    user: ngray

  # ── mieru (multiplexed tunnel, no protocol fingerprint) ───────────
  # Resistant to ML-based detection used in China / Russia.
  # Client: NekoBox or Exclave imports the JSON config printed after setup.
  mieru:
    enabled: false
    port: 14000
    user: ngray

  # ── amneziawg (obfuscated WireGuard) ─────────────────────────────
  # Adds random junk headers to every WG packet — undetectable to DPI.
  # Standard in Russia. Client: AmneziaVPN app imports the .conf printed after setup.
  amneziawg:
    enabled: false
    port: 51820

subscription:
  enabled: true
  front_sni: www.kernel.org    # subscribe URL: https://<server-IP>/s/<token>
  # Cert is self-signed with IP SAN → validates cleanly without --insecure.
  # Token is generated once and never changes unless you run `ngray regen`.

client:
  emit: [vless, anytls, hysteria2, singbox_json, subscription, qr]
