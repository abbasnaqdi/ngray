# ╔══════════════════════════════════════════════════════════════════╗
# ║          ng-ray toolkit  —  ready-to-run server config           ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Copy to config.yml (or use `make package` which does this for you).
# On a fresh server with no config.yml, `ngray server setup` auto-selects
# the best SNIs for your VPS from snis/candidates.sni.
#
# ── Core capability matrix (drives all assignments below) ─────────
#
#   Protocol     │ xray     │ shoes(Rust) │ sing-box │ standalone
#   ─────────────┼──────────┼─────────────┼──────────┼───────────
#   VLESS+Vision │ ✅ best  │ ✅ Rust fp  │ ✅ good  │ —
#   AnyTLS       │ ❌       │ ✅ best     │ ✅ good  │ —
#   XHTTP        │ ✅ ONLY  │ ❌          │ ⚠️ limited│ —
#   TUIC v5      │ ❌       │ ✅ Rust fp  │ ✅ good  │ —
#   Hysteria2    │ ❌       │ ✅ Rust fp  │ ⚠️        │ ✅ best
#   ShadowTLS v3 │ ❌       │ ❌          │ ✅ only  │ —
#   Salamander   │ —        │ ✅          │ —        │ ✅ best
#
# ── SNI assignment strategy ───────────────────────────────────────
# nginx:443 routes exactly ONE SNI to ONE core.
# BUT: www.rust-lang.org ≠ rust-lang.org (different nginx keys).
# Using both variants of a domain doubles coverage with different cores.
# Example: www.rust-lang.org → xray Vision / rust-lang.org → shoes AnyTLS

server:
  ip: auto
  enable_bbr: true

nginx:
  port: 443

cores:
  # ── xray ─ VLESS+Vision + XHTTP only ─────────────────────────────
  # xray is the reference REALITY implementation and the ONLY core with XHTTP.
  # Assign xray to www. SNI variants (xray is the primary workhorse).
  xray:
    reality:
      - {sni: www.rust-lang.org}    # best all-round REALITY SNI ✓
      - {sni: www.python.org}       # widely whitelisted ✓
      - {sni: www.archlinux.org}    # good EU geo ✓
      - {sni: www.debian.org}       # reliable, on all carrier lists ✓
    xhttp:
      - {sni: pypi.org}             # XHTTP: chunked HTTP (xray-exclusive protocol)
      - {sni: jquery.com}           # second XHTTP shape
      - {sni: react.dev}            # third XHTTP shape

  # ── shoes ─ AnyTLS + Rust VLESS + TUIC + Hysteria2 ───────────────
  # Rust TLS stack = different ClientHello fingerprint.
  # shoes is the best AnyTLS implementation. Assign non-www SNIs.
  # Using non-www of the same domains gives two routes per domain:
  #   www.rust-lang.org → xray    /    rust-lang.org → shoes
  shoes:
    reality:
      - {sni: rust-lang.org,        proto: anytls}  # non-www pair of xray's SNI
      - {sni: python.org,           proto: anytls}  # non-www pair
      - {sni: debian.org,           proto: anytls}  # non-www pair
      - {sni: archlinux.org,        proto: anytls}  # non-www pair
      - {sni: www.nginx.org,        proto: vless_vision}  # Rust Vision
      - {sni: dl.google.com,        proto: anytls}  # Google CDN: no www variant
    tuic:
      enabled: true
      port: 36712       # Rust TUIC — different stack from singbox TUIC (Go)
      sni: www.rust-lang.org
    hysteria2:
      enabled: true
      port: 36713       # Rust Hysteria2 — complements the standalone hy2 binary
      sni: www.rust-lang.org
      obfs: salamander

  # ── sing-box ─ AnyTLS + Vision + TUIC + ShadowTLS ────────────────
  # Best client support (husi, exclave, nekobox use sing-box natively).
  # ShadowTLS v3 is sing-box-exclusive: mimics real TLS to a live site.
  # Assign yet another set of SNIs for maximum coverage.
  singbox:
    reality:
      - {sni: docs.python.org,      proto: anytls}  # subdomain of python.org
      - {sni: pkg.go.dev,           proto: anytls}
      - {sni: kotlinlang.org,       proto: anytls}
      - {sni: gradle.org,           proto: vless_vision}
      - {sni: nodejs.org,           proto: anytls}
      - {sni: mozilla.org,          proto: vless_vision}
    tuic:
      enabled: true
      port: 36711       # Go TUIC (sing-box)
      sni: www.rust-lang.org
    shadowtls:
      enabled: true
      port: 2443        # ShadowTLS v3 (sing-box only) — mimics real TLS
      sni: www.rust-lang.org

  # ── hysteria2 ─ standalone binary (reference implementation) ──────
  # The standalone hysteria2 binary has the best Salamander obfuscation
  # and the most precise brutal CC. shoes hy2 is the Rust backup (port 36713).
  # alt_ports: same credentials; firewall REDIRECT maps all → port 443.
  hysteria2:
    enabled: true
    port: 443           # UDP 443: looks like HTTP/3
    alt_ports: [8443, 2087, 2096]
    sni: www.rust-lang.org
    obfs: salamander

  # ── independent cores (disabled by default) ───────────────────────
  fptn:
    enabled: false
    port: 2096
    sni: www.rust-lang.org
    user: ngray

  mieru:
    enabled: false
    port: 14000
    user: ngray

  amneziawg:
    enabled: false
    port: 51820

subscription:
  enabled: true
  front_sni: www.kernel.org  # kept for reference; subscription now served via HTTP:80

client:
  emit: [vless, anytls, hysteria2, singbox_json, subscription, qr]
