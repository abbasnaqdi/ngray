# ╔══════════════════════════════════════════════════════════════════╗
# ║          ng-ray toolkit  —  ready-to-run server config           ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Copy to config.yml and run:  sudo ./ngray server setup
#
# Everything below works as-is for most VPS servers (EU/NL/DE/FI).
# To improve coverage for your location:  ngray sni test
# To discover better SNIs near your VPS:  ngray sni discover

server:
  ip: auto        # detected from the VPS automatically
  enable_bbr: true

nginx:
  port: 443

cores:
  # ── xray ─────────────────────────────────────────────────────────
  # VLESS+REALITY+Vision: the most reliable MCI bypass.
  # XHTTP: chunked HTTP behind real nginx — survives MTN SNI inspection.
  xray:
    reality:
      - {sni: www.rust-lang.org}    # TLS1.3, h2, X25519 ✓
      - {sni: dl.google.com}        # near EU VPS, OCSP stapling ✓
      - {sni: addons.mozilla.org}   # widely whitelisted ✓
    xhttp:
      - {sni: www.python.org}       # HTTP shape — distinct from Vision ✓
      - {sni: pypi.org}             # CDN-backed, second XHTTP shape ✓

  # ── shoes (Rust TLS — different fingerprint than xray/sing-box) ──
  # AnyTLS pads every TLS record to defeat length-based DPI.
  shoes:
    reality:
      - {sni: www.debian.org,       proto: anytls}
      - {sni: www.archlinux.org,    proto: anytls}
      - {sni: www.nginx.org,        proto: vless_vision}
      - {sni: gradle.org,           proto: anytls}

  # ── sing-box (widest client support: husi, exclave, nekobox) ─────
  singbox:
    reality:
      - {sni: docs.python.org,      proto: anytls}
      - {sni: pkg.go.dev,           proto: anytls}
      - {sni: kotlinlang.org,       proto: vless_vision}
      - {sni: nodejs.org,           proto: anytls}

    # TUIC v5: QUIC+BBR, different from hysteria2. UDP, own port.
    tuic:
      enabled: true
      port: 36711
      sni: www.rust-lang.org

    # ShadowTLS v3: mimics real TLS to fool deep inspection. TCP, own port.
    shadowtls:
      enabled: true
      port: 2443
      sni: www.rust-lang.org

  # ── hysteria2 ─────────────────────────────────────────────────────
  # Salamander turns QUIC into patternless UDP — survives 50 % packet loss.
  # alt_ports: clients rotate ports if one is rate-limited (firewall handles it).
  hysteria2:
    enabled: true
    port: 443
    alt_ports: [8443, 2087, 2096]
    sni: www.rust-lang.org
    obfs: salamander

  # ── fptn (full-tunnel TUN VPN, disabled unless you need it) ───────
  fptn:
    enabled: false
    port: 2096
    sni: www.rust-lang.org

subscription:
  enabled: true
  front_sni: www.kernel.org   # subscribe URL: https://<VPS-IP>/s/<token>

client:
  emit: [vless, anytls, hysteria2, singbox_json, subscription, qr]
