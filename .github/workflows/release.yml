name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: |
          fmt=$(gofmt -l cmd internal)
          if [ -n "$fmt" ]; then echo "needs gofmt:"; echo "$fmt"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9][^"]*"' internal/version/version.go | tr -d '"')
          COMMIT=${{ github.sha }}
          SHORT=${COMMIT:0:7}
          DATE=$(date -u +%Y-%m-%d)
          LDFLAGS="-s -w -X github.com/abbasnaqdi/ng-ray/internal/version.Version=${VERSION} -X github.com/abbasnaqdi/ng-ray/internal/version.Commit=${SHORT} -X github.com/abbasnaqdi/ng-ray/internal/version.Date=${DATE}"
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          OUT="ngray-${{ matrix.os }}-${{ matrix.arch }}${EXT}"
          go build -trimpath -ldflags "$LDFLAGS" -o "$OUT" ./cmd/ngray

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngray-${{ matrix.os }}-${{ matrix.arch }}
          path: ngray-${{ matrix.os }}-${{ matrix.arch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release assets
        run: |
          cd dist
          cp ../snis/candidates.sni .
          sha256sum ngray-* candidates.sni > SHA256SUMS
          ls -lh

      - name: Create release
        run: |
          VERSION=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9][^"]*"' internal/version/version.go | tr -d '"')
          SHORT=${{ github.sha }}
          SHORT=${SHORT:0:7}
          TAG="v${VERSION}-${SHORT}"
          gh release create "$TAG" dist/* \
            --title "ngray ${TAG}" \
            --notes "Automated build from ${{ github.sha }}" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
